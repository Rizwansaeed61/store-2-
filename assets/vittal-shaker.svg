<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <linearGradient id="tumblerBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#423b36"/>
      <stop offset="30%" stop-color="#2d2723"/>
      <stop offset="70%" stop-color="#1b1714"/>
      <stop offset="100%" stop-color="#36302b"/>
    </linearGradient>
    <linearGradient id="tumblerLid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a524c"/>
      <stop offset="50%" stop-color="#231f1c"/>
      <stop offset="100%" stop-color="#463f3a"/>
    </linearGradient>
    <filter id="shakerShadow">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#140b05" flood-opacity="0.3"/>
    </filter>
  </defs>

  <ellipse cx="200" cy="410" rx="65" ry="12" fill="#20150e" opacity="0.25"/>

  <g filter="url(#shakerShadow)">
    <!-- Stainless steel tapered body -->
    <path d="M140,150 L155,395 C156,405 165,410 200,410 C235,410 244,405 245,395 L260,150 Z" fill="url(#tumblerBody)"/>

    <!-- Debossed Brand Icon on Tumbler -->
    <circle cx="200" cy="270" r="24" fill="none" stroke="#6b6057" stroke-width="2"/>
    <text x="200" y="278" font-family="'Georgia', serif" font-size="22" font-weight="900" fill="#6b6057" text-anchor="middle">V</text>

    <!-- Tumbler Grip Band -->
    <path d="M145,210 L255,210" stroke="#120e0b" stroke-width="3"/>
    <path d="M147,215 L253,215" stroke="#483f38" stroke-width="1.5"/>

    <!-- Screw Cap Lid Ring -->
    <rect x="135" y="130" width="130" height="25" rx="6" fill="url(#tumblerLid)"/>
    <line x1="140" y1="138" x2="260" y2="138" stroke="#1c1714" stroke-width="2"/>
    <line x1="140" y1="144" x2="260" y2="144" stroke="#1c1714" stroke-width="2"/>

    <!-- Flip Top Cap -->
    <path d="M150,130 C150,90 250,90 250,130 Z" fill="url(#tumblerLid)"/>
    <!-- Loop Handle -->
    <path d="M225,95 C255,95 265,120 260,135" stroke="#36302b" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="175" cy="115" r="7" fill="#1c1714"/>
  </g>
</svg>
