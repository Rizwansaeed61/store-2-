<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%">
  <defs>
    <linearGradient id="glassBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="15%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="coffeeLiquid" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#211209"/>
      <stop offset="40%" stop-color="#3d2112"/>
      <stop offset="70%" stop-color="#6f3f22"/>
      <stop offset="90%" stop-color="#b67a48"/>
      <stop offset="100%" stop-color="#f2dec6"/>
    </linearGradient>
    <linearGradient id="milkSwirl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8f0"/>
      <stop offset="50%" stop-color="#e9d2be"/>
      <stop offset="100%" stop-color="#af784c"/>
    </linearGradient>
    <filter id="glassShadow">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#140b05" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ground surface shadow -->
  <ellipse cx="150" cy="415" rx="75" ry="12" fill="#2b1a10" opacity="0.2"/>

  <g filter="url(#glassShadow)">
    <!-- Glass Straw -->
    <path d="M165,40 L165,110 L135,390" stroke="#f1efe9" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M165,40 L165,110 L135,390" stroke="#f8c792" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Glass Vessel Path -->
    <path d="M85,110 L95,390 C96,405 110,412 150,412 C190,412 204,405 205,390 L215,110 C215,102 200,98 150,98 C100,98 85,102 85,110 Z" fill="url(#coffeeLiquid)"/>

    <!-- Swirling Oat Foam Waves -->
    <path d="M88,140 C110,130 130,170 160,150 C190,130 205,160 213,140 L215,110 C210,105 180,102 150,102 C120,102 90,105 85,110 Z" fill="url(#milkSwirl)" opacity="0.95"/>
    
    <!-- Deep Swirl Tendrils -->
    <path d="M140,145 Q155,220 120,290 Q160,260 170,180" stroke="#f4e7d7" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M165,160 Q180,240 145,320" stroke="#dfc4a6" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.75"/>
    <path d="M110,180 Q105,250 135,280" stroke="#fcf6ed" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7"/>

    <!-- Floating Ice Cubes -->
    <g transform="translate(105, 150) rotate(-12)">
      <rect x="0" y="0" width="34" height="34" rx="6" fill="#ffffff" opacity="0.5" stroke="#ffffff" stroke-width="1.5"/>
      <rect x="4" y="4" width="12" height="12" rx="2" fill="#ffffff" opacity="0.6"/>
    </g>
    <g transform="translate(150, 190) rotate(18)">
      <rect x="0" y="0" width="32" height="32" rx="6" fill="#ffffff" opacity="0.45" stroke="#ffffff" stroke-width="1.5"/>
      <rect x="5" y="5" width="10" height="10" rx="2" fill="#ffffff" opacity="0.5"/>
    </g>
    <g transform="translate(115, 235) rotate(-6)">
      <rect x="0" y="0" width="30" height="30" rx="6" fill="#ffffff" opacity="0.4" stroke="#ffffff" stroke-width="1.5"/>
    </g>

    <!-- Glass Outer Wall & Reflection Highlights -->
    <path d="M85,110 L95,390 C96,405 110,412 150,412 C190,412 204,405 205,390 L215,110 C215,102 200,98 150,98 C100,98 85,102 85,110 Z" fill="url(#glassBg)" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
    
    <!-- Left Glass Specular Glare -->
    <path d="M92,120 L100,380" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>
    <path d="M98,125 L104,360" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
    
    <!-- Rim Highlight -->
    <ellipse cx="150" cy="104" rx="64" ry="7" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.8"/>
  </g>
</svg>
