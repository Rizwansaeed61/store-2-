<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <linearGradient id="canBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d2824"/>
      <stop offset="25%" stop-color="#4a423b"/>
      <stop offset="65%" stop-color="#1f1b18"/>
      <stop offset="90%" stop-color="#3b342e"/>
      <stop offset="100%" stop-color="#1b1715"/>
    </linearGradient>
    <linearGradient id="canRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c5c1bc"/>
      <stop offset="50%" stop-color="#ece8e4"/>
      <stop offset="100%" stop-color="#9a9691"/>
    </linearGradient>
    <filter id="canShadow">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#140b05" flood-opacity="0.3"/>
    </filter>
  </defs>

  <ellipse cx="200" cy="405" rx="55" ry="10" fill="#20150e" opacity="0.25"/>

  <g filter="url(#canShadow)">
    <!-- Can Rim Top -->
    <path d="M155,100 L245,100 L250,115 L150,115 Z" fill="url(#canRim)"/>
    <ellipse cx="200" cy="100" rx="45" ry="10" fill="#a4a09a"/>
    <ellipse cx="200" cy="100" rx="40" ry="7" fill="#d2ceca"/>
    <ellipse cx="200" cy="100" rx="16" ry="4" fill="#6f6a65"/>

    <!-- Can Main Cylinder -->
    <path d="M150,115 L250,115 L250,380 C250,395 240,400 200,400 C160,400 150,395 150,380 Z" fill="url(#canBody)"/>

    <!-- Vertical Specular Sheen -->
    <path d="M165,115 L165,385" stroke="#ffffff" stroke-width="6" opacity="0.18"/>
    <path d="M175,115 L175,385" stroke="#ffffff" stroke-width="2" opacity="0.12"/>

    <!-- Can Label Area -->
    <rect x="154" y="150" width="92" height="200" fill="#fdfbf7" opacity="0.95" rx="6"/>
    <text x="200" y="178" font-family="'Georgia', serif" font-size="20" font-weight="900" fill="#201610" text-anchor="middle">Vittal<tspan fill="#c59964">.</tspan></text>
    <text x="200" y="195" font-family="-apple-system, sans-serif" font-size="6.5" font-weight="800" fill="#6d5e53" text-anchor="middle" letter-spacing="1.5">CHILLED RTD COLD BREW</text>
    <line x1="168" y1="205" x2="232" y2="205" stroke="#c59964" stroke-width="1"/>
    
    <text x="200" y="235" font-family="-apple-system, sans-serif" font-size="18" font-weight="900" fill="#201610" text-anchor="middle">20g</text>
    <text x="200" y="248" font-family="-apple-system, sans-serif" font-size="7" font-weight="700" fill="#8c7a6b" text-anchor="middle">PLANT PROTEIN</text>

    <text x="200" y="278" font-family="-apple-system, sans-serif" font-size="14" font-weight="900" fill="#201610" text-anchor="middle">0g SUGAR</text>
    <text x="200" y="290" font-family="-apple-system, sans-serif" font-size="7" font-weight="700" fill="#8c7a6b" text-anchor="middle">KETO COMPLIANT</text>

    <rect x="165" y="315" width="70" height="18" rx="4" fill="#201610"/>
    <text x="200" y="327" font-family="-apple-system, sans-serif" font-size="7" font-weight="700" fill="#f7ead8" text-anchor="middle">12 FL OZ (355ml)</text>

    <!-- Bottom Rim -->
    <path d="M153,380 C153,398 247,398 247,380 L242,398 C242,404 158,404 158,398 Z" fill="url(#canRim)"/>
  </g>
</svg>
